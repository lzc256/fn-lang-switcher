name: Build and Release

on:
  push:
    branches: ["main", "dev"]
    tags:
      - "v*"
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Make script executable
        run: chmod +x build-app.sh

      - name: Run build script
        run: ./build-app.sh

      - name: Compress App
        run: |
          ditto -c -k --sequesterRsrc --keepParent .build/FnLangSwitch.app FnLangSwitch.zip

      - name: Upload Build Artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v6
        with:
          name: FnLangSwitch-Test-Build
          path: FnLangSwitch.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FnLangSwitch.zip
          name: "FnLangSwitch ${{ github.ref_name }}"
          body: |
            ## Release ${{ github.ref_name }}
            ```bash
            sudo xattr -rd com.apple.quarantine /Applications/FnLangSwitch.app
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
